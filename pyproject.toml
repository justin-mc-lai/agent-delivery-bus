[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-delivery-bus"
version = "0.1.0"
description = "Governed local control plane for multi-project agent delivery: registry, preflight, approval, idempotent dispatch, and evidence reconciliation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Agent Delivery Bus contributors" }
]
keywords = [
  "agent",
  "delivery",
  "orchestration",
  "idempotency",
  "approval",
  "hermes",
  "beacon",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/justin-mc-lai/agent-delivery-bus"
Repository = "https://github.com/justin-mc-lai/agent-delivery-bus"
Issues = "https://github.com/justin-mc-lai/agent-delivery-bus/issues"

[project.scripts]
adb = "agent_delivery_bus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
