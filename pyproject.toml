[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-delivery-bus"
version = "0.0.1"
description = "Governed local control plane for Beacon delivery through Hermes Kanban"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
adb = "agent_delivery_bus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
